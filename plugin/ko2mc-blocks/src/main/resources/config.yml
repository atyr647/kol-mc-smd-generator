# Blocks whose look is replaced by the ko2mc resource pack. The plugin keeps
# their block states from changing on their own, so their KO texture stays put.
# Generated from ko2mc/custom_blocks.py.

enabled: true              # set to false to switch all protection off
protect-note-blocks: true  # right-click doesn't re-tune (and re-texture) note blocks
protect-tripwire: true     # walking through KO plants doesn't trigger them
no-leaf-decay: true
